[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helios-trajectory-analysis"
version = "0.1.0"
description = "QRNG and consciousness research platform with trajectory analysis"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Helios Team", email = "helios@example.com"}
]
keywords = ["qrng", "consciousness", "chaos", "entropy", "trajectory-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
advanced = [
    "nolds>=0.5.0",
    "pyunicorn>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/helios-trajectory-analysis"
Documentation = "https://helios-trajectory-analysis.readthedocs.io"
Repository = "https://github.com/helios-trajectory-analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "integration: marks integration tests",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310']
include = '.pyi?$'
exclude = '''
    /(\b(\.git|build|dist|venv)\b)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["helios-trajectory-analysis"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
]
